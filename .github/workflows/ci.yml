name: ci
on:
  push: { branches: [master] }
  pull_request:
  workflow_dispatch:

permissions: { contents: read, packages: write }

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: bash scripts/validate_data.sh
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t kg-agent:local .
      - run: bash scripts/smoke.sh kg-agent:local
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag kg-agent:local "$img:${GITHUB_SHA::7}"
          docker tag kg-agent:local "$img:latest"
          docker push --all-tags "$img"

  eval:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
      KG_MODEL: "${{ vars.KG_MODEL }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: python eval/run_eval.py
